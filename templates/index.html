<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
        }

        .container{
            width:400px;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0px 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 1s ease;
            backdrop-filter: blur(10px);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            color:#333;
            font-size:28px;
        }

        .input-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#444;
        }

        input{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#f2f2f2;
            font-size:15px;
            outline:none;
            transition:0.3s;
        }

        input:focus{
            background:#e8e8e8;
            transform:scale(1.02);
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#667eea;
            color:white;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#5a67d8;
        }

        .result{
            margin-top:25px;
            padding:15px;
            border-radius:12px;
            background:#f4f7ff;
            text-align:center;
            font-size:20px;
            font-weight:bold;
            color:#333;
        }   
        @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(20px);
        }

        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    </style>

</head>
<body>

    <div class="container">

        <h1>Student Marks Predictor</h1>

        <form action="/predict" method="post">

            <div class="input-group">
                <label>Study Time</label>
                <input type="number" step="any" name="studytime" placeholder="Enter study time" required>
            </div>

            <div class="input-group">
                <label>Failures</label>
                <input type="number" step="any" name="failures" placeholder="Enter failures" required>
            </div>

            <div class="input-group">
                <label>Absences</label>
                <input type="number" step="any" name="absences" placeholder="Enter absences" required>
            </div>

            <div class="input-group">
                <label>G1 Marks</label>
                <input type="number" step="any" name="G1" placeholder="Enter G1 marks" required>
            </div>

            <div class="input-group">
                <label>G2 Marks</label>
                <input type="number" step="any" name="G2" placeholder="Enter G2 marks" required>
            </div>

            <button type="submit">Predict Marks</button>

        </form>

        {% if prediction_text %}

        <div class="result">
            {{ prediction_text }}
        </div>

        {% endif %}

    </div>

</body>
</html>
